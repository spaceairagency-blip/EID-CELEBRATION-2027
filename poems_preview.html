<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Preview: Personalized Eid Poems</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Manrope:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --mint: #7fe0c0;
      --mint-soft: #bff2de;
      --rose: #f6a6b2;
      --gold: #f3cf8a;
      --cream: #fbf3e6;
      --bg-deep: #060a12;
      --border: rgba(243, 207, 138, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Manrope', sans-serif;
    }

    body {
      background: var(--bg-deep);
      background: radial-gradient(circle at 50% 120%, #171f38 0%, #060a12 60%);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient Particles */
    .ambient-dust {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .dust {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
      opacity: 0;
      animation: floatUp var(--dur) linear infinite var(--del);
      filter: blur(2px);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }

      20% {
        opacity: 0.6;
      }

      80% {
        opacity: 0.6;
      }

      100% {
        transform: translateY(-20vh) scale(1.5);
        opacity: 0;
      }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 800px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--gold);
      opacity: 0;
      animation: fadeInOut 12s infinite;
      position: absolute;
      top: 12vh;
      text-shadow: 0 0 10px rgba(243, 207, 138, 0.5);
    }

    @keyframes fadeInOut {

      0%,
      100% {
        opacity: 0;
        transform: translateY(10px);
      }

      10%,
      80% {
        opacity: 0.8;
        transform: translateY(0);
      }
    }

    .poem-stage {
      width: 90%;
      max-width: 600px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .arabic-bg {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Amiri', serif;
      font-size: clamp(8rem, 25vw, 16rem);
      color: var(--gold);
      opacity: 0;
      pointer-events: none;
      direction: rtl;
      filter: blur(8px);
      transition: opacity 3s ease, filter 3s ease;
      white-space: nowrap;
    }

    .arabic-bg.active {
      opacity: 0.05;
      filter: blur(5px);
    }

    .poem-greeting {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(2.5rem, 8vw, 4rem);
      background: linear-gradient(180deg, var(--cream) 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 10px 40px rgba(243, 207, 138, 0.3);
      margin-bottom: 30px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 1.5s cubic-bezier(.2, .9, .3, 1);
    }

    .poem-greeting.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .poem-line {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.4rem, 4.5vw, 2rem);
      color: var(--cream);
      font-style: italic;
      font-weight: 500;
      line-height: 1.6;
      min-height: 1.6em;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .poem-line.last {
      color: var(--mint-soft);
      text-shadow: 0 0 15px rgba(127, 224, 192, 0.3);
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background-color: var(--gold);
      vertical-align: middle;
      animation: blink 0.8s infinite;
      margin-left: 4px;
      box-shadow: 0 0 8px var(--gold);
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    .fade-out {
      animation: smoothFadeOut 2s forwards;
    }

    @keyframes smoothFadeOut {
      to {
        opacity: 0;
        transform: translateY(-30px);
        filter: blur(8px);
      }
    }

    /* Lanterns & Fireworks */
    #show-canvas {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    #show-lanterns {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .show-lantern {
      position: absolute;
      bottom: -140px;
      width: 34px;
      height: 46px;
      animation: lanternRise linear infinite;
    }

    .show-lantern .body {
      width: 100%;
      height: 78%;
      border-radius: 14px 14px 20px 20px;
      box-shadow: 0 0 18px 4px var(--lc), inset 0 -6px 10px rgba(0, 0, 0, 0.25);
      background: radial-gradient(circle at 50% 35%, #fff8e0, var(--lc) 65%);
    }

    .show-lantern .cap {
      width: 44%;
      height: 10%;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 3px 3px 0 0;
    }

    .show-lantern .flame {
      position: absolute;
      left: 50%;
      bottom: -6px;
      width: 5px;
      height: 9px;
      background: #fff3c2;
      border-radius: 50% 50% 50% 50%;
      transform: translateX(-50%);
      filter: blur(0.5px);
      opacity: 0.9;
    }

    @keyframes lanternRise {
      0% {
        transform: translate(0, 0) rotate(-2deg);
        opacity: 0;
      }

      6% {
        opacity: 0.95;
      }

      50% {
        transform: translate(3vw, -56vh) rotate(2deg);
      }

      94% {
        opacity: 0.9;
      }

      100% {
        transform: translate(-2vw, -112vh) rotate(-2deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <canvas id="show-canvas"></canvas>
  <div id="show-lanterns"></div>

  <div class="ambient-dust" id="ambient-dust"></div>

  <div class="container">
    <div class="eyebrow" id="eyebrow">A Special Gift</div>

    <div class="poem-stage" id="poem-stage">
      <div class="arabic-bg" id="arabic-bg"></div>
      <div class="poem-greeting" id="poem-greeting"></div>
      <div class="poem-line" id="line0"></div>
      <div class="poem-line" id="line1"></div>
      <div class="poem-line" id="line2"></div>
      <div class="poem-line last" id="line3"></div>
    </div>
  </div>

  <script>
    // Fireworks & Lanterns logic
    const showCanvas = document.getElementById('show-canvas');
    const showLanterns = document.getElementById('show-lanterns');
    let showCtx = showCanvas.getContext('2d');
    let showRafId = null;
    let showParticles = [];
    let showLastLaunch = 0;
    let showLanternInterval = null;

    const FW_COLORS = ['#ff5d73', '#ffd166', '#7fe0c0', '#bff2de', '#f6a6b2', '#f3cf8a', '#a78bfa', '#5fd0ff', '#ffffff'];
    const LANTERN_COLORS = ['#f3cf8a', '#f6a6b2', '#7fe0c0', '#ffb37a', '#ffdca8'];

    function resizeShowCanvas() {
      showCanvas.width = window.innerWidth * devicePixelRatio;
      showCanvas.height = window.innerHeight * devicePixelRatio;
      showCanvas.style.width = window.innerWidth + 'px';
      showCanvas.style.height = window.innerHeight + 'px';
      showCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    window.addEventListener('resize', resizeShowCanvas);
    resizeShowCanvas();

    function rand(a, b) { return a + Math.random() * (b - a); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function launchFirework() {
      const w = window.innerWidth, h = window.innerHeight;
      const targetX = rand(w * 0.15, w * 0.85);
      const targetY = rand(h * 0.16, h * 0.5);
      const color = pick(FW_COLORS);

      showParticles.push({
        type: 'rocket', x: targetX + rand(-30, 30), y: h + 20, vx: rand(-0.4, 0.4), vy: rand(-9.5, -7.5),
        targetY, color, trail: []
      });
    }

    function explode(x, y, color) {
      const count = Math.floor(rand(38, 64));
      const shapeRoll = Math.random();
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + rand(-0.12, 0.12);
        const speed = shapeRoll < 0.15 ? rand(1, 2) : rand(2.2, 6.2);
        showParticles.push({
          type: 'spark', x, y,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          color: Math.random() < 0.25 ? pick(FW_COLORS) : color,
          life: 1, decay: rand(0.010, 0.020), size: rand(1.6, 3.2), gravity: 0.045
        });
      }
      for (let i = 0; i < 18; i++) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(0.6, 2.2);
        showParticles.push({
          type: 'glitter', x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          color: '#ffffff', life: 1, decay: rand(0.02, 0.035), size: rand(0.8, 1.6), gravity: 0.02
        });
      }
    }

    function stepShow(ts) {
      const w = window.innerWidth, h = window.innerHeight;
      showCtx.clearRect(0, 0, w, h);

      if (ts - showLastLaunch > rand(650, 1150)) {
        showLastLaunch = ts;
        launchFirework();
        if (Math.random() < 0.35) { setTimeout(() => { launchFirework(); }, rand(120, 260)); }
      }

      for (let i = showParticles.length - 1; i >= 0; i--) {
        const p = showParticles[i];
        if (p.type === 'rocket') {
          p.trail.push({ x: p.x, y: p.y });
          if (p.trail.length > 8) p.trail.shift();
          p.x += p.vx; p.y += p.vy; p.vy += 0.05;
          showCtx.strokeStyle = p.color; showCtx.lineWidth = 2; showCtx.globalAlpha = 0.6;
          showCtx.beginPath();
          p.trail.forEach((pt, idx) => { idx === 0 ? showCtx.moveTo(pt.x, pt.y) : showCtx.lineTo(pt.x, pt.y); });
          showCtx.stroke();
          showCtx.globalAlpha = 1;
          if (p.vy >= -1 || p.y <= p.targetY) {
            explode(p.x, p.y, p.color);
            showParticles.splice(i, 1);
          }
        } else {
          p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.vx *= 0.985;
          p.life -= p.decay;
          if (p.life <= 0) { showParticles.splice(i, 1); continue; }
          showCtx.globalAlpha = Math.max(0, p.life);
          showCtx.fillStyle = p.color;
          showCtx.beginPath();
          showCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          showCtx.fill();
          showCtx.globalAlpha = 1;
        }
      }
      if (showParticles.length > 900) { showParticles.splice(0, showParticles.length - 900); }
      showRafId = requestAnimationFrame(stepShow);
    }

    function spawnLantern() {
      const el = document.createElement('div');
      el.className = 'show-lantern';
      const color = pick(LANTERN_COLORS);
      el.style.setProperty('--lc', color);
      el.style.left = rand(4, 94) + 'vw';
      el.style.animationDuration = rand(14, 22) + 's';
      el.innerHTML = '<div class="cap"></div><div class="body"></div><div class="flame"></div>';
      showLanterns.appendChild(el);
      setTimeout(() => el.remove(), 23000);
    }

    for (let i = 0; i < 4; i++) { setTimeout(() => { launchFirework(); }, i * 260); }
    for (let i = 0; i < 5; i++) { setTimeout(spawnLantern, i * 900); }
    showLanternInterval = setInterval(spawnLantern, 2600);
    showRafId = requestAnimationFrame(stepShow);

    // Create ambient dust
    const dustContainer = document.getElementById('ambient-dust');
    for (let i = 0; i < 30; i++) {
      let d = document.createElement('div');
      d.className = 'dust';
      d.style.left = Math.random() * 100 + '%';
      d.style.width = d.style.height = (Math.random() * 6 + 2) + 'px';
      d.style.setProperty('--dur', (Math.random() * 15 + 10) + 's');
      d.style.setProperty('--del', '-' + (Math.random() * 15) + 's');
      dustContainer.appendChild(d);
    }

    const sequence = [
      {
        name: "Lopa Yeasmin",
        arabicBg: "مرشدة",
        lines: [
          "A guiding light, steadfast and true,",
          "Bringing warmth to all you do.",
          "May this Eid fill your heart with grace,",
          "And leave a glowing smile upon your face."
        ]
      },
      {
        name: "Tahia Yeasmin",
        arabicBg: "طاهية",
        lines: [
          "Like the quiet moon that lights the night,",
          "Your spirit makes the world so bright.",
          "May laughter fill your festive day,",
          "And endless blessings guide your way."
        ]
      },
      {
        name: "Nipa Yeasmin",
        arabicBg: "شاهيدة",
        lines: [
          "With gentle strength and endless care,",
          "Spreading sweetness everywhere.",
          "May joy surround you like a glowing seam,",
          "And make this Eid a beautiful dream."
        ]
      }
    ];

    const stage = document.getElementById('poem-stage');
    const arabicBg = document.getElementById('arabic-bg');
    const greeting = document.getElementById('poem-greeting');
    const lines = [
      document.getElementById('line0'),
      document.getElementById('line1'),
      document.getElementById('line2'),
      document.getElementById('line3')
    ];
    const eyebrow = document.getElementById('eyebrow');

    let currentIndex = 0;

    function playSequence(index) {
      if (index >= sequence.length) {
        // Loop back to start to continuously play the preview
        setTimeout(() => playSequence(0), 1000);
        return;
      }

      const data = sequence[index];

      // Reset Stage
      stage.classList.remove('fade-out');
      greeting.classList.remove('visible');
      arabicBg.classList.remove('active');
      lines.forEach(l => l.innerHTML = "");

      // Setup
      arabicBg.textContent = data.arabicBg;
      greeting.textContent = "For " + data.name;

      setTimeout(() => { arabicBg.classList.add('active'); }, 100);

      // Intro Fade
      setTimeout(() => {
        greeting.classList.add('visible');

        // Reset eyebrow animation to sync with the poem appearance
        eyebrow.style.animation = 'none';
        eyebrow.offsetHeight;
        eyebrow.style.animation = 'fadeInOut 15s forwards';
      }, 800);

      let delay = 2500;
      let charSpeed = 60; // ms per char

      data.lines.forEach((lineText, i) => {
        setTimeout(() => {
          typeLine(lines[i], lineText, charSpeed, () => {
            if (i < data.lines.length - 1) {
              lines[i].innerHTML = lineText; // remove cursor
            }
          });
        }, delay);
        delay += (lineText.length * charSpeed) + 800; // Wait for typing + pause between lines
      });

      // Total duration for this poem before fading out
      setTimeout(() => {
        lines[3].innerHTML = data.lines[3]; // remove last cursor
        setTimeout(() => {
          stage.classList.add('fade-out');
          setTimeout(() => playSequence(index + 1), 2200); // start next after fade finishes
        }, 3500); // hold reading time after finished typing
      }, delay + 500);
    }

    function typeLine(element, text, speed, onComplete) {
      let i = 0;
      element.innerHTML = '<span class="text"></span><span class="cursor"></span>';
      const textSpan = element.querySelector('.text');

      function type() {
        if (i < text.length) {
          textSpan.textContent += text.charAt(i);
          i++;
          setTimeout(type, speed + (Math.random() * 40));
        } else {
          if (onComplete) onComplete();
        }
      }
      type();
    }

    // Start the sequence
    setTimeout(() => playSequence(0), 500);

  </script>
</body>

</html>
