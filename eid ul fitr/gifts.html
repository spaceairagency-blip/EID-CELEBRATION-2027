<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Blessings</title>
 <link rel="icon" type="image/x-icon" href="EIDCT.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
:root{--void:#020008;--gold:#D4AF37;--gold-l:#FFE566;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow-x:hidden;background:var(--void);}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none;}
#ui{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:60px 20px 100px;}
.title{font-family:'Cinzel Decorative',serif;font-size:clamp(1.2rem,4vw,2rem);background:linear-gradient(135deg,#fff,#FFE566);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:8px;}
.subtitle{font-family:'Cormorant Garamond',serif;font-style:italic;color:rgba(255,255,255,0.5);letter-spacing:4px;font-size:0.9rem;text-align:center;margin-bottom:50px;}
.boxes{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;perspective:1200px;}
.box-wrap{width:clamp(130px,18vw,160px);height:clamp(150px,20vw,185px);}
.box{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.8s cubic-bezier(0.4,0,0.2,1);cursor:pointer;}
.box.opened{transform:rotateY(180deg);}
.box-front,.box-back{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;}
.box-front{background:linear-gradient(135deg,rgba(212,175,55,0.15),rgba(212,175,55,0.05));border:1.5px solid rgba(212,175,55,0.5);box-shadow:0 0 30px rgba(212,175,55,0.15);}
.box-front:hover{border-color:var(--gold);box-shadow:0 0 40px rgba(212,175,55,0.35);transform:scale(1.03);}
.box.opened .box-front{transform:none;}
.box-back{background:linear-gradient(135deg,rgba(0,60,30,0.6),rgba(0,80,40,0.4));border:1.5px solid rgba(100,200,130,0.4);transform:rotateY(180deg);}
.gift-icon{font-size:clamp(2.5rem,6vw,3.5rem);margin-bottom:8px;display:block;}
.gift-num{font-family:'Cinzel Decorative',serif;font-size:0.65rem;color:var(--gold);letter-spacing:3px;text-transform:uppercase;}
.gift-prompt{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.75rem;color:rgba(255,255,255,0.4);margin-top:6px;}
.back-arabic{font-family:'Amiri',serif;font-size:clamp(0.9rem,2vw,1.1rem);color:#FFE566;direction:rtl;line-height:1.5;margin-bottom:10px;}
.back-en{font-family:'Cormorant Garamond',serif;font-size:clamp(0.72rem,1.5vw,0.82rem);color:rgba(255,255,255,0.75);line-height:1.5;font-style:italic;}
.back-type{font-family:'Cinzel Decorative',serif;font-size:0.55rem;color:rgba(100,200,130,0.8);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
#status{font-family:'Cormorant Garamond',serif;font-style:italic;color:rgba(255,255,255,0.5);font-size:0.9rem;text-align:center;margin-top:40px;min-height:30px;}
#next-btn{display:none;margin-top:30px;padding:14px 40px;border:1px solid var(--gold);background:rgba(212,175,55,0.1);color:#FFE566;font-family:'Cinzel Decorative',serif;font-size:0.75rem;letter-spacing:3px;cursor:pointer;border-radius:40px;transition:all 0.3s;}
#next-btn:hover{background:rgba(212,175,55,0.25);box-shadow:0 0 25px rgba(212,175,55,0.3);}
.progress-bar{position:fixed;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#FFE566,#D4AF37);width:0%;z-index:30;}
canvas{position:fixed;inset:0;z-index:0;}
.ribbon{position:absolute;top:0;left:50%;transform:translateX(-50%);width:4px;height:100%;background:linear-gradient(180deg,var(--gold),rgba(212,175,55,0.3));border-radius:2px;}
.ribbon-h{position:absolute;top:50%;left:0;right:0;height:4px;transform:translateY(-50%);background:linear-gradient(90deg,rgba(212,175,55,0.3),var(--gold),rgba(212,175,55,0.3));border-radius:2px;}
.bow{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:1.2rem;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="ui">
  <div class="title">Your Eid Blessings</div>
  <div class="subtitle">Open each gift to receive your blessing</div>
  <div class="boxes" id="boxes"></div>
  <div id="status">Tap each gift box to unwrap your blessing ✦</div>
  <button id="next-btn" onclick="go()">Continue the Journey ✦</button>
</div>
<div class="progress-bar" id="pb"></div>

<script>
const GIFTS=[
  {icon:'🌙',num:'I',arabic:'اللَّهُمَّ تَقَبَّلْ مِنَّا',en:'O Allah, accept from us our fasts, our prayers and our good deeds.',type:'Dua'},
  {icon:'⭐',num:'II',arabic:'تَقَبَّلَ اللَّهُ مِنَّا وَمِنكُم',en:'May Allah accept from us and from you. Eid Mubarak!',type:'Greeting'},
  {icon:'🕌',num:'III',arabic:'كُلُّ عَامٍ وَأَنْتُمْ بِخَيْرٍ',en:'May every year find you in good health and happiness.',type:'Blessing'},
  {icon:'✨',num:'IV',arabic:'جَعَلَ اللَّهُ هَذَا الْعِيدَ مُبَارَكاً',en:'May Allah make this Eid blessed for you and your family.',type:'Prayer'},
  {icon:'💛',num:'V',arabic:'أَعَادَهُ اللَّهُ عَلَيْنَا بِالْخَيْرِ',en:'May Allah return this occasion to us with goodness, year after year.',type:'Wish'},
];

// BG canvas
const bg=document.getElementById('bg'),bctx=bg.getContext('2d');
let BW,BH;function resize(){BW=bg.width=innerWidth;BH=bg.height=innerHeight;}resize();window.addEventListener('resize',resize);
let pts=[];for(let i=0;i<180;i++)pts.push({x:Math.random(),y:Math.random(),r:Math.random()*0.8+0.1,t:Math.random()*Math.PI*2,s:Math.random()*0.012+0.003,b:Math.random()*0.4+0.1,vx:(Math.random()-0.5)*0.0001,vy:-Math.random()*0.00008-0.00003});
function drawBg(){
  bctx.fillStyle='rgba(2,0,8,0.15)';bctx.fillRect(0,0,BW,BH);
  pts.forEach(p=>{p.t+=p.s;p.y+=p.vy;p.x+=p.vx;if(p.y<0)p.y=1;if(p.x<0)p.x=1;if(p.x>1)p.x=0;const b=p.b+Math.sin(p.t)*0.2;bctx.fillStyle=`rgba(212,175,55,${Math.max(0,b*0.5)})`;bctx.beginPath();bctx.arc(p.x*BW,p.y*BH,p.r,0,Math.PI*2);bctx.fill();});
  requestAnimationFrame(drawBg);
}
drawBg();

// Build gift boxes
let openedCount=0;
const boxesEl=document.getElementById('boxes');
GIFTS.forEach((g,i)=>{
  const wrap=document.createElement('div');wrap.className='box-wrap';
  wrap.innerHTML=`
  <div class="box" id="box-${i}" onclick="openBox(${i})">
    <div class="box-front">
      <div class="ribbon"></div><div class="ribbon-h"></div>
      <div class="bow">🎀</div>
      <span class="gift-icon">${g.icon}</span>
      <span class="gift-num">Gift ${g.num}</span>
      <span class="gift-prompt">Tap to open</span>
    </div>
    <div class="box-back">
      <div class="back-type">${g.type}</div>
      <div class="back-arabic">${g.arabic}</div>
      <div class="back-en">${g.en}</div>
    </div>
  </div>`;
  boxesEl.appendChild(wrap);
});

function openBox(i){
  const box=document.getElementById(`box-${i}`);
  if(box.classList.contains('opened'))return;
  box.classList.add('opened');
  openedCount++;
  // confetti from that box position
  const rect=box.getBoundingClientRect();
  confetti({particleCount:50,spread:70,origin:{x:rect.left/innerWidth+rect.width/innerWidth/2,y:rect.top/innerHeight},colors:['#D4AF37','#FFE566','#ffffff','#00a86b'],scalar:1.1});
  // speak the dua
  const u=new SpeechSynthesisUtterance(GIFTS[i].en);
  u.rate=0.85;u.volume=0.8;speechSynthesis.speak(u);
  const status=document.getElementById('status');
  if(openedCount>=GIFTS.length){
    status.textContent='✦ All blessings received! MashaAllah! ✦';
    document.getElementById('next-btn').style.display='block';
    setTimeout(()=>{confetti({particleCount:150,spread:120,origin:{x:0.5,y:0.3},colors:['#D4AF37','#FFE566','#ffffff','#00a86b','#a855f7'],shapes:['star'],scalar:1.5});},300);
    setTimeout(go,8000);
  } else {
    status.textContent=`${openedCount} of ${GIFTS.length} opened — keep going! ✦`;
  }
}

const DUR=45000;
const pb=document.getElementById('pb');
pb.style.transition=`width ${DUR}ms linear`;
setTimeout(()=>pb.style.width='100%',50);
function go(){speechSynthesis.cancel();window.location.href='feast.html';}
setTimeout(go,DUR);
</script>
</body>
</html>
