<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Moon is Sighted</title>
 <link rel="icon" type="image/x-icon" href="EIDCT.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000510;}
#c{position:fixed;inset:0;z-index:1;}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none;}
.top-text{position:absolute;top:10%;left:0;right:0;text-align:center;}
.announcement{font-family:'Amiri',serif;font-size:clamp(1.5rem,5vw,3rem);color:#FFE566;direction:rtl;opacity:0;animation:rise 2s ease 2s forwards;text-shadow:0 0 40px rgba(255,229,102,0.5);}
.announcement-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(0.9rem,2.5vw,1.3rem);color:rgba(255,255,255,0.65);letter-spacing:4px;opacity:0;animation:rise 2s ease 2.8s forwards;margin-top:10px;}
.bottom-msg{position:absolute;bottom:15%;left:0;right:0;text-align:center;}
.hadith{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(0.85rem,2vw,1.05rem);color:rgba(255,255,255,0.5);max-width:600px;margin:0 auto;line-height:1.8;opacity:0;animation:rise 2s ease 5s forwards;padding:0 20px;}
.progress-bar{position:fixed;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#FFE566,#D4AF37);width:0%;z-index:30;}
.skip{position:fixed;bottom:25px;right:25px;color:rgba(255,255,255,0.4);font-family:'Cormorant Garamond',serif;font-size:0.85rem;cursor:pointer;letter-spacing:2px;border:none;background:none;transition:color 0.3s;pointer-events:all;z-index:60;}
.skip:hover{color:#D4AF37;}
@keyframes rise{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="top-text">
    <div class="announcement">ثَبَتَ هِلَالُ شَهْرِ شَوَّال</div>
    <div class="announcement-en">"The crescent of Shawwal has been sighted — Eid is confirmed"</div>
  </div>
  <div class="bottom-msg">
    <div class="hadith">"Whoever fasts Ramadan out of faith and seeking reward from Allah, his previous sins will be forgiven."<br>— Sahih al-Bukhari 2014</div>
  </div>
</div>
<button class="skip" onclick="go()">Next →</button>
<div class="progress-bar" id="pb"></div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}resize();window.addEventListener('resize',resize);

const DUR=10000;
let startT=Date.now();
let stars=[];for(let i=0;i<300;i++){stars.push({x:Math.random()*2-0.5,y:Math.random()*0.7,r:Math.random()*1.3+0.2,t:Math.random()*Math.PI*2,s:Math.random()*0.01+0.003,b:Math.random()*0.6+0.1});}
let lanterns=[];for(let i=0;i<12;i++){lanterns.push({x:Math.random(),y:0.7+Math.random()*0.2,vy:-(Math.random()*0.0003+0.0001),swing:Math.random()*Math.PI*2,swingS:Math.random()*0.02+0.01,col:`hsl(${Math.random()*40+10},100%,60%)`,size:Math.random()*8+6});}

function drawCityline(moonY,progress){
  // Sky gradient
  const sg=ctx.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,`rgba(0,5,16,${0.98-progress*0.1})`);
  sg.addColorStop(0.5,`rgba(0,15,40,${0.6})`);
  sg.addColorStop(1,'rgba(0,30,60,0.4)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);

  // Ambient moon glow on horizon
  if(progress>0.2){
    const gp=Math.min((progress-0.2)/0.6,1);
    const mg=ctx.createRadialGradient(W*0.72,H*0.65,0,W*0.72,H*0.65,H*0.5);
    mg.addColorStop(0,`rgba(255,244,184,${gp*0.12})`);mg.addColorStop(1,'transparent');
    ctx.fillStyle=mg;ctx.fillRect(0,0,W,H);
  }

  // Stars
  stars.forEach(s=>{s.t+=s.s;const b=(s.b+Math.sin(s.t)*0.25)*Math.min(progress*3,1);if(b<0)return;ctx.fillStyle=`rgba(255,255,255,${b})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill();});

  // Moon rising
  const moonP=Math.min(progress*1.6,1);
  const mx=W*0.72;
  const moonStartY=H+80,moonEndY=H*0.25;
  const my=moonStartY+(moonEndY-moonStartY)*moonP;
  const mr=W>600?55:35;
  const moonAlpha=Math.min(moonP*1.5,1);
  // Glow
  const mg2=ctx.createRadialGradient(mx,my,0,mx,my,mr*4);
  mg2.addColorStop(0,`rgba(255,244,184,${moonAlpha*0.25})`);mg2.addColorStop(0.4,`rgba(255,229,102,${moonAlpha*0.08})`);mg2.addColorStop(1,'transparent');
  ctx.fillStyle=mg2;ctx.beginPath();ctx.arc(mx,my,mr*4,0,Math.PI*2);ctx.fill();
  // Moon body
  ctx.save();
  ctx.fillStyle=`rgba(255,244,184,${moonAlpha})`;ctx.shadowColor='#FFE566';ctx.shadowBlur=25;
  ctx.beginPath();ctx.arc(mx,my,mr,0,Math.PI*2);ctx.fill();
  // Crescent shadow
  ctx.globalCompositeOperation='destination-out';
  ctx.fillStyle='rgba(0,0,0,1)';ctx.beginPath();ctx.arc(mx+mr*0.32,my,mr*0.88,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation='source-over';ctx.restore();
  // Star near moon
  if(moonAlpha>0.5){
    const sa=moonAlpha*1;const sx=mx+mr*1.6,sy=my-mr*0.4;
    ctx.fillStyle=`rgba(255,255,255,${sa})`;ctx.shadowColor='rgba(255,255,255,0.8)';ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(sx,sy,2.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }

  // Lanterns floating
  if(progress>0.4){
    lanterns.forEach(l=>{
      l.y+=l.vy*0.5;l.swing+=l.swingS;
      const lx=l.x*W+Math.sin(l.swing)*8,ly=l.y*H;
      // Glow
      const lg=ctx.createRadialGradient(lx,ly,0,lx,ly,l.size*3);
      lg.addColorStop(0,`${l.col.replace('hsl','hsla').replace(')',',0.4)')}`,);
      lg.addColorStop(1,'transparent');
      ctx.fillStyle=lg;ctx.beginPath();ctx.arc(lx,ly,l.size*3,0,Math.PI*2);ctx.fill();
      // Lantern body
      ctx.fillStyle=l.col;
      ctx.beginPath();ctx.ellipse(lx,ly,l.size*0.5,l.size,0,0,Math.PI*2);ctx.fill();
      // String
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(lx,ly-l.size);ctx.lineTo(lx,ly-l.size-15);ctx.stroke();
    });
  }

  // City silhouette
  ctx.fillStyle='rgba(0,3,15,0.95)';
  ctx.beginPath();ctx.moveTo(0,H);
  const buildings=[
    [0,0.35],[0.05,0.15],[0.08,0.2],[0.12,0.1],[0.16,0.22],[0.19,0.08],[0.22,0.18],[0.26,0.12],[0.3,0.22],[0.34,0.06],[0.36,0.2],[0.4,0.14],[0.43,0.24],[0.47,0.1],[0.5,0.18],[0.54,0.28],[0.57,0.12],[0.6,0.22],[0.64,0.16],[0.68,0.06],[0.7,0.18],[0.74,0.12],[0.78,0.22],[0.82,0.16],[0.86,0.28],[0.9,0.1],[0.94,0.2],[0.98,0.14],[1,0.35],[1,1]
  ];
  let lastX=0,lastH=H*0.35;
  buildings.forEach(([bx,bh])=>{const px=bx*W,ph=bh*H;ctx.lineTo(px,ph);});
  ctx.closePath();ctx.fill();

  // Windows glow
  ctx.fillStyle='rgba(255,200,80,0.4)';
  for(let i=0;i<25;i++){const wx=Math.random()*W,wy=H*0.5+Math.random()*H*0.3;ctx.beginPath();ctx.rect(wx,wy,3,4);ctx.fill();}
}

let frame=0;
function draw(){
  frame++;
  const elapsed=Date.now()-startT;
  const progress=Math.min(elapsed/DUR,1);
  ctx.clearRect(0,0,W,H);
  drawCityline(H*0.25,progress);
  requestAnimationFrame(draw);
}
draw();

const pb=document.getElementById('pb');
pb.style.transition=`width ${DUR}ms linear`;
setTimeout(()=>pb.style.width='100%',50);
function go(){window.location.href='gifts.html';}
setTimeout(go,DUR);
</script>
</body>
</html>
