<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2</title>
 <link rel="icon" type="image/x-icon" href="EIDCT.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0015;}
#c{position:fixed;inset:0;}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;pointer-events:none;}
.num{font-family:'Cinzel Decorative',serif;font-size:clamp(12rem,30vw,22rem);font-weight:900;background:linear-gradient(135deg,#a855f7,#ec4899,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 50px rgba(168,85,247,0.8));animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;opacity:0;}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:rgba(255,255,255,0.5);letter-spacing:6px;font-size:0.9rem;text-transform:uppercase;margin-top:-20px;}
.lanterns{display:flex;gap:60px;margin-top:30px;opacity:0;animation:rise 0.8s ease 0.5s forwards;}
@keyframes pop{from{opacity:0;transform:scale(0.3);}to{opacity:1;transform:scale(1);}}
@keyframes rise{from{opacity:0;}to{opacity:1;}}
@keyframes sway{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
.lantern{font-size:3.5rem;display:inline-block;animation:sway 2s ease-in-out infinite;transform-origin:top center;}
.lantern:nth-child(2){animation-delay:0.5s;animation-direction:reverse;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="num">2</div>
  <div class="sub">Eids in a Year · Fitr &amp; Adha</div>
  <div class="lanterns"><span class="lantern">🏮</span><span class="lantern">🏮</span></div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;function r(){W=c.width=innerWidth;H=c.height=innerHeight;}r();window.addEventListener('resize',r);
let pts=[];for(let i=0;i<200;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.2+0.2,c:[Math.random()*50+180,Math.random()*50+50,Math.random()*200+50],t:Math.random()*Math.PI*2,s:Math.random()*0.02+0.005});
function draw(){
  ctx.fillStyle='rgba(10,0,21,0.2)';ctx.fillRect(0,0,W,H);
  pts.forEach(p=>{p.t+=p.s;p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;const b=0.3+Math.sin(p.t)*0.3;ctx.fillStyle=`rgba(${p.c[0]},${p.c[1]},${p.c[2]},${b})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
  requestAnimationFrame(draw);
}
draw();
setTimeout(()=>window.location.href='c1.html',5000);
</script>
</body>
</html>
