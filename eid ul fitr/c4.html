<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4</title>
 <link rel="icon" type="image/x-icon" href="EIDCT.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#02000a;}
#c{position:fixed;inset:0;}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;pointer-events:none;}
.num{font-family:'Cinzel Decorative',serif;font-size:clamp(12rem,30vw,22rem);font-weight:900;background:linear-gradient(135deg,#8B7316,#D4AF37,#FFE566,#D4AF37);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;opacity:0;letter-spacing:-10px;text-shadow:none;filter:drop-shadow(0 0 30px rgba(212,175,55,0.7));}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:rgba(255,255,255,0.5);letter-spacing:6px;font-size:0.9rem;text-transform:uppercase;margin-top:-20px;}
.kaaba-wrap{margin-top:30px;opacity:0;animation:rise 0.8s ease 0.6s forwards;}
@keyframes pop{from{opacity:0;transform:scale(0.3) rotate(-10deg);}to{opacity:1;transform:scale(1) rotate(0deg);}}
@keyframes rise{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="num">4</div>
  <div class="sub">Weeks of the Blessed Month</div>
  <div class="kaaba-wrap">
    <svg width="120" height="120" viewBox="0 0 120 120">
      <rect x="25" y="35" width="70" height="75" fill="#1a0830" stroke="#D4AF37" stroke-width="2"/>
      <rect x="25" y="35" width="70" height="15" fill="#D4AF37" opacity="0.7"/>
      <rect x="45" y="75" width="30" height="35" fill="#0a0015" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="60" cy="20" r="12" fill="none" stroke="#FFE566" stroke-width="1.5" opacity="0.6"/>
      <path d="M60 12 L62 17 L68 17 L63 20 L65 26 L60 23 L55 26 L57 20 L52 17 L58 17Z" fill="#FFE566" opacity="0.8"/>
    </svg>
  </div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;function r(){W=c.width=innerWidth;H=c.height=innerHeight;}r();window.addEventListener('resize',r);
let orbs=[];for(let i=0;i<8;i++){const a=i/8*Math.PI*2;orbs.push({a,r:Math.min(W,H)*0.35,s:0.003+Math.random()*0.002,sz:Math.random()*3+1});}
let stars=[];for(let i=0;i<100;i++)stars.push({x:Math.random(),y:Math.random(),s:Math.random()*0.8+0.2,t:Math.random()*Math.PI*2,sp:Math.random()*0.015+0.005});
function draw(){
  ctx.fillStyle='rgba(2,0,10,0.2)';ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{s.t+=s.sp;const b=0.2+Math.sin(s.t)*0.25;ctx.fillStyle=`rgba(255,229,102,${b})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.s,0,Math.PI*2);ctx.fill();});
  orbs.forEach(o=>{
    o.a+=o.s;
    const x=W/2+Math.cos(o.a)*o.r,y=H/2+Math.sin(o.a)*o.r*0.4;
    ctx.fillStyle='rgba(212,175,55,0.6)';ctx.beginPath();ctx.arc(x,y,o.sz,0,Math.PI*2);ctx.fill();
    const g=ctx.createRadialGradient(x,y,0,x,y,o.sz*4);
    g.addColorStop(0,'rgba(212,175,55,0.2)');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,o.sz*4,0,Math.PI*2);ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
setTimeout(()=>window.location.href='c3.html',5000);
</script>
</body>
</html>
