<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Eid Duas · Silent & Smooth</title>
 <link rel="icon" type="image/x-icon" href="EIDCT.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --void: #020008;
  --gold: #D4AF37;
  --gold-l: #FFE566;
  --dim: rgba(255,255,255,0.45);
}

html, body {
  width: 100%;
  min-height: 100%;
  background: var(--void);
  overflow-x: hidden;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.65;
}

#ui {
  position: relative;
  z-index: 10;
  padding: 70px 24px 140px;
  max-width: 820px;
  margin: 0 auto;
}

.chapter {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 0.85rem;
  letter-spacing: 5px;
  color: var(--dim);
  text-transform: uppercase;
  text-align: center;
  opacity: 0;
  animation: riseFade 1.1s ease 0.2s forwards;
}

.title {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(1.4rem, 5vw, 2.6rem);
  background: linear-gradient(135deg, #fff, var(--gold-l), var(--gold));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-align: center;
  margin: 14px 0 8px;
  opacity: 0;
  animation: riseFade 1s ease 0.5s forwards;
}

.subtitle {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  color: var(--dim);
  text-align: center;
  font-size: 0.95rem;
  letter-spacing: 3px;
  margin-bottom: 55px;
  opacity: 0;
  animation: riseFade 1s ease 0.8s forwards;
}

.dua-block {
  margin-bottom: 55px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.8s ease, transform 0.8s ease;
  border-left: 2px solid rgba(212, 175, 55, 0.25);
  padding-left: 30px;
  position: relative;
}

.dua-block.revealed {
  opacity: 1;
  transform: translateY(0);
}

.dua-block::before {
  content: '';
  position: absolute;
  left: -5px;
  top: 0;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px rgba(212, 175, 55, 0.7);
}

.dua-num {
  font-family: 'Cinzel Decorative', serif;
  font-size: 0.6rem;
  color: var(--gold);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 14px;
  opacity: 0.75;
}

.dua-arabic {
  font-family: 'Amiri', serif;
  font-size: clamp(1.5rem, 5.5vw, 2.3rem);
  color: var(--gold-l);
  direction: rtl;
  text-align: right;
  line-height: 1.85;
  text-shadow: 0 0 18px rgba(255, 229, 102, 0.2);
  margin-bottom: 12px;
}

.dua-tr {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(0.85rem, 2vw, 0.98rem);
  color: rgba(255, 255, 255, 0.5);
  margin-bottom: 10px;
}

.dua-en {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(0.92rem, 2.2vw, 1.08rem);
  color: rgba(255, 255, 255, 0.78);
  line-height: 1.7;
}

.dua-src {
  font-size: 0.65rem;
  color: rgba(212, 175, 55, 0.55);
  letter-spacing: 2.5px;
  margin-top: 12px;
  text-transform: uppercase;
}

.divider {
  width: 55%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.35), transparent);
  margin: 0 auto 55px;
}

.closing {
  text-align: center;
  padding: 45px 0 30px;
  opacity: 0;
  animation: riseFade 1.2s ease 2.4s forwards;
}

.closing-arabic {
  font-family: 'Amiri', serif;
  font-size: clamp(2.2rem, 8vw, 4.5rem);
  color: var(--gold-l);
  direction: rtl;
  text-shadow: 0 0 45px rgba(255, 229, 102, 0.45);
}

.closing-en {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  color: var(--dim);
  font-size: clamp(0.9rem, 2.5vw, 1.2rem);
  margin-top: 16px;
  letter-spacing: 3px;
}

#next-btn {
  display: block;
  margin: 20px auto 0;
  padding: 14px 48px;
  border: 1px solid var(--gold);
  background: rgba(212, 175, 55, 0.08);
  color: var(--gold-l);
  font-family: 'Cinzel Decorative', serif;
  font-size: 0.75rem;
  letter-spacing: 4px;
  cursor: pointer;
  border-radius: 60px;
  transition: all 0.35s;
  opacity: 0;
  animation: riseFade 0.9s ease 2.8s forwards;
  backdrop-filter: blur(3px);
}

#next-btn:hover {
  background: rgba(212, 175, 55, 0.22);
  box-shadow: 0 0 28px rgba(212, 175, 55, 0.4);
}

.progress-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--gold-l), var(--gold));
  width: 0%;
  z-index: 40;
  box-shadow: 0 0 4px var(--gold);
  transition: width 0.05s linear;
}

.skip {
  position: fixed;
  bottom: 28px;
  right: 28px;
  color: var(--dim);
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.85rem;
  cursor: pointer;
  letter-spacing: 2.5px;
  background: none;
  border: none;
  transition: all 0.25s;
  z-index: 50;
  backdrop-filter: blur(4px);
  padding: 4px 12px;
  border-radius: 60px;
}

.skip:hover {
  color: var(--gold);
}

.scroll-hint {
  text-align: center;
  font-size: 0.7rem;
  color: rgba(212, 175, 55, 0.5);
  margin-top: 65px;
  letter-spacing: 2px;
  font-family: 'Cinzel Decorative', serif;
  opacity: 0;
  animation: gentlePulse 2s infinite, riseFade 1.5s ease 4s forwards;
}

@keyframes riseFade {
  0% { opacity: 0; transform: translateY(22px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes gentlePulse {
  0% { opacity: 0.3; }
  100% { opacity: 0.8; }
}

@media (max-width: 560px) {
  #ui { padding: 50px 18px 130px; }
  .dua-block { padding-left: 18px; margin-bottom: 42px; }
  .divider { margin-bottom: 42px; }
}
</style>
</head>
<body>

<canvas id="canvasBg"></canvas>
<div id="ui">
  <div class="chapter">✧ Chapter of Light ✧</div>
  <div class="title">Duas of Eid al-Fitr</div>
  <div class="subtitle">Words that rise like incense</div>

  <div id="duas-container"></div>

  <div class="closing">
    <div class="closing-arabic">رَبَّنَا تَقَبَّلْ مِنَّا</div>
    <div class="closing-en">Our Lord, accept from us — and grant us steadfastness.</div>
  </div>
  
  <button id="next-btn">⟡ Journey to Finale ⟡</button>
  <div class="scroll-hint">↓  slowly descending  ↓</div>
</div>
<button class="skip" id="skipBtn">✦ onward ✦</button>
<div class="progress-bar" id="progressFill"></div>

<script>
  // ---------- EID DUAS (5 sacred invocations) ----------
  const DUAS_LIB = [
    {
      num: "DUA I — ACCEPTANCE",
      arabic: "اللَّهُمَّ تَقَبَّلْ مِنَّا صِيَامَنَا وَقِيَامَنَا",
      translit: "Allāhumma taqabbal minnā siyāmanā wa qiyāmanā",
      english: "O Allah, accept from us our fasting and our night prayers. Forgive our shortcomings and embrace our humble efforts.",
      source: "— narrated by the Companions, may Allah be pleased"
    },
    {
      num: "DUA II — EID GREETING",
      arabic: "تَقَبَّلَ اللَّهُ مِنَّا وَمِنكُم",
      translit: "Taqabbalallāhu minnā wa minkum",
      english: "May Allah accept (good deeds) from us and from you. May this day bring forgiveness and joy to every heart.",
      source: "— authenticated by Ibn Hajar Al-Asqalani"
    },
    {
      num: "DUA III — THE COMPREHENSIVE PRAYER",
      arabic: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
      translit: "Rabbanā ātinā fid-dunyā hasanatan wa fil-ākhirati hasanatan wa qinā adhāban-nār",
      english: "Our Lord, grant us goodness in this world and goodness in the Hereafter, and protect us from the torment of the Fire.",
      source: "— Surah Al-Baqarah 2:201"
    },
    {
      num: "DUA IV — PARDON & MERCY",
      arabic: "اللَّهُمَّ إِنَّكَ عَفُوٌّ كَرِيمٌ تُحِبُّ الْعَفْوَ فَاعْفُ عَنَّا",
      translit: "Allāhumma innaka 'Afuwwun Karīm tuhibbul-'afwa fa'fu 'annā",
      english: "O Allah, You are the Pardoner, Generous, You love to forgive, so forgive us and erase our sins.",
      source: "— Sunan Ibn Majah (Eid & Laylatul Qadr tradition)"
    },
    {
      num: "DUA V — FOR FAMILY & BELIEVERS",
      arabic: "رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ",
      translit: "Rabbighfir lī wa liwālidayya wa lil-mu'minīna wal-mu'mināt",
      english: "My Lord, forgive me, my parents, and all believing men and women — unite us in goodness on the Day we meet You.",
      source: "— inspired by Surah Ibrahim & authentic supplications"
    }
  ];

  const container = document.getElementById('duas-container');
  
  // Build all dua blocks
  DUAS_LIB.forEach((dua, idx) => {
    const block = document.createElement('div');
    block.className = 'dua-block';
    block.setAttribute('data-dua-idx', idx);
    block.innerHTML = `
      <div class="dua-num">${dua.num}</div>
      <div class="dua-arabic">${dua.arabic}</div>
      <div class="dua-tr">${dua.translit}</div>
      <div class="dua-en">${dua.english}</div>
      <div class="dua-src">${dua.source}</div>
    `;
    container.appendChild(block);
    
    if (idx < DUAS_LIB.length - 1) {
      const divider = document.createElement('div');
      divider.className = 'divider';
      container.appendChild(divider);
    }
  });
  
  // Reveal duas on scroll
  const allDuaBlocks = document.querySelectorAll('.dua-block');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
      }
    });
  }, { threshold: 0.2, rootMargin: "0px 0px -20px 0px" });
  
  allDuaBlocks.forEach(block => observer.observe(block));
  
  setTimeout(() => {
    allDuaBlocks.forEach(block => {
      const rect = block.getBoundingClientRect();
      if (rect.top < window.innerHeight - 100) {
        block.classList.add('revealed');
      }
    });
  }, 200);
  
  // ========== SMOOTH AUTO-SCROLL - NO SHAKING ==========
  // Simple, linear auto-scroll that doesn't fight with user input
  // Uses a single timer and doesn't try to resume/jump positions
  
  const progressFill = document.getElementById('progressFill');
  const SCROLL_DURATION = 54000; // 54 seconds
  let scrollAnimationId = null;
  let autoScrollActive = true;
  let scrollCompleted = false;
  let startTime = null;
  let startScrollTop = 0;
  let targetScrollTop = 0;
  
  function getMaxScroll() {
    return Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  }
  
  function updateProgress(ratio) {
    progressFill.style.width = `${Math.min(1, Math.max(0, ratio)) * 100}%`;
  }
  
  function stopAutoScroll() {
    if (scrollAnimationId) {
      cancelAnimationFrame(scrollAnimationId);
      scrollAnimationId = null;
    }
    autoScrollActive = false;
  }
  
  function startAutoScroll() {
    if (!autoScrollActive || scrollCompleted) return;
    if (scrollAnimationId) cancelAnimationFrame(scrollAnimationId);
    
    const maxScroll = getMaxScroll();
    if (maxScroll <= 0) {
      updateProgress(1);
      return;
    }
    
    startTime = performance.now();
    startScrollTop = window.scrollY;
    targetScrollTop = maxScroll;
    
    function step(now) {
      if (!autoScrollActive || scrollCompleted) return;
      
      const elapsed = now - startTime;
      let t = Math.min(1, elapsed / SCROLL_DURATION);
      // Smooth easeInOutCubic for fluid motion
      const ease = t < 0.5 
        ? 4 * t * t * t 
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
      
      const newScrollTop = startScrollTop + (targetScrollTop - startScrollTop) * ease;
      window.scrollTo(0, newScrollTop);
      updateProgress(t);
      
      if (t < 1) {
        scrollAnimationId = requestAnimationFrame(step);
      } else {
        // Finished
        window.scrollTo(0, targetScrollTop);
        updateProgress(1);
        scrollCompleted = true;
        autoScrollActive = false;
        scrollAnimationId = null;
      }
    }
    
    scrollAnimationId = requestAnimationFrame(step);
  }
  
  // Pause auto-scroll when user interacts, but don't restart it
  // This prevents the "shaking" from resume attempts
  let userInteracted = false;
  
  function pauseAutoScrollOnInteraction() {
    if (!autoScrollActive || scrollCompleted) return;
    if (userInteracted) return;
    
    userInteracted = true;
    // Stop the current scroll smoothly
    if (scrollAnimationId) {
      cancelAnimationFrame(scrollAnimationId);
      scrollAnimationId = null;
    }
    autoScrollActive = false;
    // We do NOT attempt to resume - that's what causes shaking
    // User can continue reading at their own pace
  }
  
  // Listen for user interactions that should stop auto-scroll
  window.addEventListener('wheel', pauseAutoScrollOnInteraction, { passive: true });
  window.addEventListener('touchstart', pauseAutoScrollOnInteraction, { passive: true });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'PageDown' || e.key === 'PageUp' || e.key === 'Home' || e.key === 'End') {
      pauseAutoScrollOnInteraction();
    }
  });
  
  // Start auto-scroll after page loads
  window.addEventListener('load', () => {
    setTimeout(() => {
      if (getMaxScroll() > 0 && !scrollCompleted && !userInteracted) {
        autoScrollActive = true;
        startAutoScroll();
      } else {
        updateProgress(1);
      }
    }, 500);
  });
  
  // Also start if DOM is ready
  setTimeout(() => {
    if (getMaxScroll() > 0 && !scrollCompleted && !userInteracted && !scrollAnimationId) {
      autoScrollActive = true;
      startAutoScroll();
    }
  }, 1000);
  
  // Background canvas animation
  const canvas = document.getElementById('canvasBg');
  const ctxCanvas = canvas.getContext('2d');
  let w = window.innerWidth, h = window.innerHeight;
  
  function resizeCanvas() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  
  let phase = 0;
  function drawBackground() {
    if (!ctxCanvas) return;
    ctxCanvas.fillStyle = '#020008';
    ctxCanvas.fillRect(0, 0, w, h);
    phase += 0.0022;
    const centerX = w * 0.5;
    const centerY = h * 0.55;
    ctxCanvas.save();
    ctxCanvas.translate(centerX, centerY);
    ctxCanvas.rotate(phase * 0.3);
    
    for (let ring = 0; ring < 3; ring++) {
      const radius = 110 + ring * 70 + Math.sin(phase) * 12;
      ctxCanvas.beginPath();
      ctxCanvas.arc(0, 0, radius, 0, Math.PI * 2);
      ctxCanvas.strokeStyle = `rgba(212, 175, 55, ${0.08 + ring * 0.03})`;
      ctxCanvas.lineWidth = 1.2;
      ctxCanvas.stroke();
    }
    
    for (let i = 0; i < 16; i++) {
      ctxCanvas.save();
      ctxCanvas.rotate(i * (Math.PI * 2 / 16) + phase * 0.5);
      ctxCanvas.beginPath();
      ctxCanvas.moveTo(0, 0);
      ctxCanvas.lineTo(0, -Math.min(w, h) * 0.45);
      ctxCanvas.strokeStyle = `rgba(212, 175, 55, 0.1)`;
      ctxCanvas.lineWidth = 0.6;
      ctxCanvas.stroke();
      ctxCanvas.restore();
    }
    
    for (let k = 0; k < 22; k++) {
      const radAngle = phase * 1.7 + k;
      const xOff = Math.sin(radAngle) * 130 + Math.cos(phase + k) * 70;
      const yOff = Math.cos(radAngle * 0.9) * 90 + Math.sin(phase * 1.2) * 40;
      ctxCanvas.beginPath();
      ctxCanvas.fillStyle = `rgba(255, 229, 102, 0.2)`;
      ctxCanvas.arc(xOff, yOff, 1.2, 0, Math.PI * 2);
      ctxCanvas.fill();
    }
    ctxCanvas.restore();
    requestAnimationFrame(drawBackground);
  }
  drawBackground();
  
  // Navigation
  function navigateToFinale() {
    stopAutoScroll();
    window.location.href = 'finale.html';
  }
  
  document.getElementById('next-btn').addEventListener('click', navigateToFinale);
  document.getElementById('skipBtn').addEventListener('click', navigateToFinale);
  
  // Auto-redirect after 54 seconds (if auto-scroll wasn't interrupted and completed)
  setTimeout(() => {
    if (!scrollCompleted && !userInteracted) {
      window.location.href = 'finale.html';
    } else if (scrollCompleted) {
      window.location.href = 'finale.html';
    }
  }, 56000); // Slightly longer than scroll to ensure completion
  
  // If scroll completes naturally, redirect after a short delay
  const checkCompletion = setInterval(() => {
    if (scrollCompleted || (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 10)) {
      clearInterval(checkCompletion);
      setTimeout(() => {
        if (!userInteracted) {
          window.location.href = 'finale.html';
        }
      }, 1500);
    }
  }, 500);
</script>
</body>
</html>
