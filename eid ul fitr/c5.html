<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5</title>
 <link rel="icon" type="image/x-icon" href="EIDCT.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Amiri:wght@700&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#020008;}
#c{position:fixed;inset:0;}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;pointer-events:none;}
.num{font-family:'Cinzel Decorative',serif;font-size:clamp(12rem,30vw,22rem);font-weight:900;color:transparent;-webkit-text-stroke:2px #D4AF37;text-shadow:0 0 80px rgba(212,175,55,0.6);animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards,glow 1.5s ease-in-out infinite 0.5s;opacity:0;letter-spacing:-10px;}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:rgba(255,255,255,0.5);letter-spacing:6px;font-size:0.9rem;text-transform:uppercase;margin-top:-20px;}
.pillars{display:flex;gap:20px;margin-top:40px;}
.pillar{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;}
.pillar-icon{font-size:2rem;}
.pillar-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.75rem;color:#D4AF37;letter-spacing:2px;white-space:nowrap;}
@keyframes pop{from{opacity:0;transform:scale(0.3);}to{opacity:1;transform:scale(1);}}
@keyframes glow{0%,100%{text-shadow:0 0 80px rgba(212,175,55,0.6);}50%{text-shadow:0 0 120px rgba(212,175,55,1),0 0 200px rgba(255,229,102,0.5);}}
@keyframes pillar-rise{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="num">5</div>
  <div class="sub">The Five Pillars of Islam</div>
  <div class="pillars" id="pillars">
    <div class="pillar"><div class="pillar-icon">☪️</div><div class="pillar-name">Shahada</div></div>
    <div class="pillar"><div class="pillar-icon">🕌</div><div class="pillar-name">Salah</div></div>
    <div class="pillar"><div class="pillar-icon">💰</div><div class="pillar-name">Zakat</div></div>
    <div class="pillar"><div class="pillar-icon">🌙</div><div class="pillar-name">Sawm</div></div>
    <div class="pillar"><div class="pillar-icon">🕋</div><div class="pillar-name">Hajj</div></div>
  </div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;function r(){W=c.width=innerWidth;H=c.height=innerHeight;}r();window.addEventListener('resize',r);
let stars=[];for(let i=0;i<150;i++)stars.push({x:Math.random(),y:Math.random(),s:Math.random()*1.5+0.3,t:Math.random()*Math.PI*2,sp:Math.random()*0.02+0.005});
function draw(){
  ctx.fillStyle='rgba(2,0,8,0.15)';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*0.5);
  g.addColorStop(0,'rgba(0,50,30,0.08)');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{s.t+=s.sp;const b=0.3+Math.sin(s.t)*0.3;ctx.fillStyle=`rgba(212,175,55,${b})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.s,0,Math.PI*2);ctx.fill();});
  requestAnimationFrame(draw);
}
draw();
const ps=document.querySelectorAll('.pillar');ps.forEach((p,i)=>setTimeout(()=>{p.style.animation=`pillar-rise 0.5s ease ${i*0.1}s forwards`;},500+i*200));
setTimeout(()=>window.location.href='c4.html',5000);
</script>
</body>
</html>
