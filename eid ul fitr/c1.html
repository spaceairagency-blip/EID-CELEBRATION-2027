<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1</title>
 <link rel="icon" type="image/x-icon" href="EIDCT.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#020008;}
#c{position:fixed;inset:0;}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;pointer-events:none;}
.num{font-family:'Cinzel Decorative',serif;font-size:clamp(12rem,30vw,22rem);font-weight:900;color:#FFE566;text-shadow:0 0 40px #FFE566,0 0 80px #D4AF37,0 0 160px rgba(212,175,55,0.5);animation:pop 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards,shake 0.5s ease 0.5s;opacity:0;letter-spacing:-10px;}
.sub{font-family:'Cinzel Decorative',serif;font-size:clamp(0.8rem,3vw,1.2rem);color:#D4AF37;letter-spacing:6px;text-transform:uppercase;margin-top:-10px;animation:rise 0.5s ease 0.3s both;}
@keyframes pop{from{opacity:0;transform:scale(0.1);}to{opacity:1;transform:scale(1);}}
@keyframes shake{0%,100%{transform:scale(1);}25%{transform:scale(1.05) rotate(-1deg);}75%{transform:scale(1.05) rotate(1deg);}}
@keyframes rise{from{opacity:0;}to{opacity:1;}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="num">1</div>
  <div class="sub">⭐ Eid is HERE ⭐</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;function r(){W=c.width=innerWidth;H=c.height=innerHeight;}r();window.addEventListener('resize',r);
let sparks=[];function burst(x,y){for(let i=0;i<60;i++){const a=Math.random()*Math.PI*2,v=Math.random()*6+2;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,maxLife:0.5+Math.random()*0.5,r:Math.random()*3+1,c:`hsl(${Math.random()*40+30},100%,${60+Math.random()*20}%)`});}}
let phase=0,burstTimer=0;
function draw(){
  phase+=0.05;burstTimer+=0.05;
  ctx.fillStyle='rgba(2,0,8,0.25)';ctx.fillRect(0,0,W,H);
  const gr=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*0.5);
  gr.addColorStop(0,`rgba(212,175,55,${0.06+Math.sin(phase)*0.04})`);gr.addColorStop(1,'transparent');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  if(burstTimer>0.4){burst(Math.random()*W,Math.random()*H);burstTimer=0;}
  sparks=sparks.filter(s=>s.life>0);
  sparks.forEach(s=>{
    s.x+=s.vx;s.y+=s.vy;s.vy+=0.08;s.life-=0.02;
    ctx.save();ctx.globalAlpha=s.life/s.maxLife;
    ctx.fillStyle=s.c;ctx.shadowColor=s.c;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*s.life,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
  requestAnimationFrame(draw);
}
draw();
// Speak
const u=new SpeechSynthesisUtterance("Eid... Mubarak!");
u.rate=0.7;u.pitch=1.2;u.volume=1;
setTimeout(()=>speechSynthesis.speak(u),200);
setTimeout(()=>window.location.href='eid.html',5000);
</script>
</body>
</html>
