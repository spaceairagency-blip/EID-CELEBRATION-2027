<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid al-Fitr 2027 | The Night the Moon Returns</title>
 <link rel="icon" type="image/x-icon" href="EIDCT.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{--void:#020008;--gold:#D4AF37;--gold-l:#FFE566;--silver:#E8E8F0;--moon:#FFF9E0;--dim:rgba(255,255,255,0.45);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void);}
canvas{position:fixed;inset:0;z-index:0;}
#ui{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(0.8rem,2vw,1rem);letter-spacing:6px;color:var(--dim);text-transform:uppercase;opacity:0;animation:rise 1.5s ease 0.5s forwards;}
.arabic-main{font-family:'Amiri',serif;font-size:clamp(3rem,10vw,7rem);color:var(--gold-l);text-shadow:0 0 60px rgba(212,175,55,0.5),0 0 120px rgba(212,175,55,0.2);opacity:0;animation:rise 1.5s ease 1s forwards;margin:20px 0;direction:rtl;}
.title{font-family:'Cinzel Decorative',serif;font-size:clamp(1.2rem,4vw,2.8rem);background:linear-gradient(135deg,var(--silver),var(--gold-l),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px;opacity:0;animation:rise 1.5s ease 1.5s forwards;}
.year{font-family:'Cinzel Decorative',serif;font-size:clamp(0.7rem,2vw,1rem);letter-spacing:8px;color:var(--dim);opacity:0;animation:rise 1.5s ease 2s forwards;margin-top:8px;}
.begin-btn{pointer-events:all;margin-top:50px;padding:16px 48px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-family:'Cinzel Decorative',serif;font-size:0.75rem;letter-spacing:4px;cursor:pointer;border-radius:40px;transition:all 0.4s;opacity:0;animation:rise 1.5s ease 2.5s forwards;position:relative;overflow:hidden;}
.begin-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(212,175,55,0),rgba(212,175,55,0.15));opacity:0;transition:opacity 0.4s;}
.begin-btn:hover::before{opacity:1;}
.begin-btn:hover{box-shadow:0 0 30px rgba(212,175,55,0.4);transform:scale(1.03);}
.skip{position:fixed;bottom:30px;right:30px;color:var(--dim);font-family:'Cormorant Garamond',serif;font-size:0.85rem;cursor:pointer;letter-spacing:2px;pointer-events:all;z-index:20;border:none;background:none;transition:color 0.3s;}
.skip:hover{color:var(--gold);}
.progress-bar{position:fixed;bottom:0;left:0;height:2px;background:linear-gradient(90deg,var(--gold-l),var(--gold));width:0%;transition:width linear;z-index:30;}
@keyframes rise{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="tagline">1448 AH &nbsp;·&nbsp; The Blessed Night</div>
  <div class="arabic-main">عيد الفطر مبارك</div>
  <div class="title">Eid al-Fitr 2027</div>
  <div class="year">The Night the Moon Returns</div>
  <button class="begin-btn" onclick="go()">✦ Begin the Journey ✦</button>
</div>
<button class="skip" onclick="go()">Skip →</button>
<div class="progress-bar" id="pb"></div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,stars=[],moon={y:0,phase:0};
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;moon.y=H*0.3;}
resize();window.addEventListener('resize',resize);

// Stars
for(let i=0;i<250;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.2+0.2,t:Math.random()*Math.PI*2,s:Math.random()*0.02+0.005,b:Math.random()*0.5+0.2});

// Crescent Moon
function drawMoon(x,y,r,progress){
  ctx.save();
  // Glow
  const g=ctx.createRadialGradient(x,y,0,x,y,r*2.5);
  g.addColorStop(0,`rgba(255,249,224,${0.12*progress})`);
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.5,0,Math.PI*2);ctx.fill();
  // Moon body
  ctx.fillStyle=`rgba(255,244,184,${progress})`;
  ctx.shadowColor='#FFE566';ctx.shadowBlur=30*progress;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  // Shadow bite (crescent)
  ctx.globalCompositeOperation='destination-out';
  ctx.fillStyle='rgba(0,0,0,1)';
  ctx.beginPath();ctx.arc(x+r*0.35,y,r*0.9,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.restore();
}

let moonY=H+100,startTime=Date.now(),dur=8000;
function draw(){
  const t=(Date.now()-startTime)/dur;
  ctx.fillStyle='rgba(2,0,8,0.25)';ctx.fillRect(0,0,W,H);
  // Stars
  stars.forEach(s=>{
    s.t+=s.s;
    const bri=s.b+Math.sin(s.t)*0.3;
    ctx.fillStyle=`rgba(255,255,255,${bri})`;
    ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill();
  });
  // Moon rising
  const moonProgress=Math.min(t*1.8,1);
  moonY=H+100-(H*0.6)*moonProgress;
  const mp=Math.min(moonProgress*2,1);
  drawMoon(W*0.75,moonY,W>600?60:40,mp);
  // Ambient nebula
  ctx.save();
  ctx.globalCompositeOperation='screen';
  const ng=ctx.createRadialGradient(W*0.75,moonY,0,W*0.75,moonY,200);
  ng.addColorStop(0,`rgba(212,175,55,${0.03*mp})`);ng.addColorStop(1,'transparent');
  ctx.fillStyle=ng;ctx.beginPath();ctx.arc(W*0.75,moonY,200,0,Math.PI*2);ctx.fill();
  ctx.restore();
  requestAnimationFrame(draw);
}
draw();

// Progress bar
const pb=document.getElementById('pb');
pb.style.transition=`width ${dur}ms linear`;
setTimeout(()=>pb.style.width='100%',50);

function go(){window.location.href='farewell.html';}
setTimeout(go,dur);
</script>
</body>
</html>
