<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>চতুর্থ শ্রেণি — বাংলা শূন্যস্থান পূরণ (পাঠ ১২–২৩)</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #18222f;
      --muted: #5b6878;
      --accent: #0f766e;
      --accent-hover: #0d5e58;
      --secondary: #334155;
      --secondary-hover: #1e293b;
      --blank-bg: #eef2f6;
      --answer-bg: #dcfce7;
      --answer-text: #14532d;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans Bengali", "Hind Siliguri", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.85;
      font-size: 18px;
    }

    header {
      background: linear-gradient(135deg, #0f766e, #115e59);
      color: #fff;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(15, 118, 110, 0.18);
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 1.8rem;
    }

    header p {
      margin: 0;
      opacity: 0.92;
      font-size: 1rem;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 900px;
      margin: 24px auto 60px;
      padding: 0 16px;
    }

    .chapter-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .chapter-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--blank-bg);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .chapter-title {
      margin: 0;
      font-size: 1.3rem;
      color: var(--accent);
    }

    .chapter-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.08s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-show {
      background: var(--accent);
      color: #fff;
    }

    .btn-show:hover {
      background: var(--accent-hover);
    }

    .btn-hide {
      background: var(--blank-bg);
      color: var(--secondary);
    }

    .btn-hide:hover {
      background: #dbe3ec;
    }

    .btn-global-show {
      background: var(--accent);
      color: #fff;
      padding: 10px 18px;
    }

    .btn-global-hide {
      background: var(--secondary);
      color: #fff;
      padding: 10px 18px;
    }

    .btn-global-hide:hover {
      background: var(--secondary-hover);
    }

    ol.questions {
      margin: 0;
      padding-left: 24px;
    }

    ol.questions li {
      margin-bottom: 12px;
      padding-left: 4px;
    }

    .blank {
      display: inline-block;
      min-width: 110px;
      padding: 1px 10px;
      margin: 0 3px;
      border-radius: 6px;
      background: var(--blank-bg);
      color: var(--muted);
      border-bottom: 2px dashed #94a3b8;
      text-align: center;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .blank.revealed {
      background: var(--answer-bg);
      color: var(--answer-text);
      border-bottom: 2px solid #16a34a;
    }

    @media (max-width: 600px) {
      body {
        font-size: 16.5px;
      }
      .chapter-card {
        padding: 18px 16px;
      }
      .blank {
        min-width: 86px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>চতুর্থ শ্রেণি — আমার বাংলা বই (শূন্যস্থান পূরণ)</h1>
    <p>পাঠ ১২ থেকে পাঠ ২৩ পর্যন্ত — সরাসরি উত্তর দেখতে বা লুকাতে বাটন ব্যবহার করুন</p>
  </header>

  <div class="toolbar">
    <button class="btn-global-show" onclick="toggleAll(true)">সব উত্তর দেখুন (Show All)</button>
    <button class="btn-global-hide" onclick="toggleAll(false)">সব উত্তর লুকান (Hide All)</button>
  </div>

  <main class="container" id="app"></main>

    const app = document.getElementById("app");

    chapters.forEach((ch, chIdx) => {
      const card = document.createElement("section");
      card.className = "chapter-card";
      card.id = `chapter-${chIdx}`;

      const listHtml = ch.items
        .map(([before, answer, after], qIdx) => {
          const id = `ans-${chIdx}-${qIdx}`;
          return `<li>${before}<span class="blank" id="${id}" data-answer="${answer}">________</span>${after}</li>`;
        })
        .join("");

      card.innerHTML = `
        <div class="chapter-header">
          <h2 class="chapter-title">${ch.title}</h2>
          <div class="chapter-actions">
            <button class="btn-show" onclick="setChapterAnswers(${chIdx}, true)">Show Answer</button>
            <button class="btn-hide" onclick="setChapterAnswers(${chIdx}, false)">Hide Answer</button>
          </div>
        </div>
        <ol class="questions">${listHtml}</ol>
      `;

      app.appendChild(card);
    });

    function setBlankState(el, show) {
      if (show) {
        el.textContent = el.dataset.answer;
        el.classList.add("revealed");
      } else {
        el.textContent = "________";
        el.classList.remove("revealed");
      }
    }

    function setChapterAnswers(chIdx, show) {
      const blanks = document.querySelectorAll(`#chapter-${chIdx} .blank`);
      blanks.forEach((el) => setBlankState(el, show));
    }

    function toggleAll(show) {
      document.querySelectorAll(".blank").forEach((el) => setBlankState(el, show));
    }
  </script>
</body>
</html>
