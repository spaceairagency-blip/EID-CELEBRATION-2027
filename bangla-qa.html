<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>চতুর্থ শ্রেণি — বাংলা অনুশীলনী প্রশ্নোত্তর সমাধান (পাঠ ১২–২৩)</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #18222f;
      --muted: #5b6878;
      --accent: #0f766e;
      --accent-hover: #0d5e58;
      --secondary: #334155;
      --secondary-hover: #1e293b;
      --ans-bg: #dcfce7;
      --ans-text: #14532d;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans Bengali", "Hind Siliguri", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      font-size: 18px;
    }

    header {
      background: linear-gradient(135deg, #0f766e, #115e59);
      color: #fff;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(15, 118, 110, 0.16);
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 1.8rem;
    }

    header p {
      margin: 0;
      opacity: 0.94;
      font-size: 1rem;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 920px;
      margin: 24px auto 60px;
      padding: 0 16px;
    }

    .chapter-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 22px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .chapter-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid #eef2f6;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .chapter-title {
      margin: 0;
      font-size: 1.28rem;
      color: var(--accent);
    }

    .chapter-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.08s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-show {
      background: var(--accent);
      color: #fff;
    }

    .btn-show:hover {
      background: var(--accent-hover);
    }

    .btn-hide {
      background: #eef2f6;
      color: var(--secondary);
    }

    .btn-hide:hover {
      background: #dbe3ec;
    }

    .btn-global-show {
      background: var(--accent);
      color: #fff;
      padding: 10px 18px;
    }

    .btn-global-hide {
      background: var(--secondary);
      color: #fff;
      padding: 10px 18px;
    }

    .btn-global-hide:hover {
      background: var(--secondary-hover);
    }

    .qa-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .qa-item {
      padding: 14px 0;
      border-bottom: 1px dashed #e2e8f0;
    }

    .qa-item:last-child {
      border-bottom: none;
      padding-bottom: 4px;
    }

    .question {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .answer-box {
      display: none;
      background: var(--ans-bg);
      color: var(--ans-text);
      padding: 10px 14px;
      border-radius: 8px;
      border-left: 4px solid #16a34a;
      font-weight: 500;
    }

    .answer-box.visible {
      display: block;
    }

    @media (max-width: 600px) {
      body {
        font-size: 16.5px;
      }
      .chapter-card {
        padding: 18px 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>চতুর্থ শ্রেণি — বাংলা অনুশীলনী প্রশ্নোত্তর সমাধান</h1>
    <p>পাঠ ১২ থেকে পাঠ ২৩ পর্যন্ত — সহজ ভাষায় পূর্ণাঙ্গ উত্তর</p>
  </header>

  <div class="toolbar">
    <button class="btn-global-show" onclick="toggleAll(true)">সব উত্তর দেখুন (Show Answer)</button>
    <button class="btn-global-hide" onclick="toggleAll(false)">সব উত্তর লুকান (Hide Answer)</button>
  </div>

  <main class="container" id="app"></main>

  <script>
    const chapters = [
      {
        title: "পাঠ ১২: কাজলা দিদি (অনুশীলনী প্রশ্নোত্তর)",
        qa: [
          {
            q: "১. বাঁশবাগানের মাথার ওপর চাঁদ উঠলে চারদিকের পরিবেশ কেমন হয়?",
            a: "বাঁশবাগানের মাথার ওপর চাঁদ উঠলে চারদিক আলোয় ভরে যায় এবং পুকুর ধারে নেবু গাছের নিচে জোনাক পোকা জ্বলে। তখন ফুলের গন্ধে চারপাশ ভরে ওঠে।"
          },
          {
            q: "২. ছোট ভাই কেন কাজলা দিদিকে খুঁজছে?",
            a: "কাজলা দিদি আর নেই, তাই ছোট ভাই তাকে খুব মনে করছে। রাতে একা জেগে থেকে সে তার প্রিয় দিদিকে কাছে পেতে খুঁজছে।"
          },

            q: "৩. ছোট ভাইয়ের রাতে ঘুম না আসার কারণ কী?",
            a: "কাজলা দিদির কথা মনে পড়ায় এবং ফুলের গন্ধে ছোট ভাইয়ের রাতে ঘুম আসে না। সে একা জেগে থাকে এবং দিদির কথা ভাবে।"
          },
          {
            q: "৪. দিদির চলে যাওয়ার পর ছোট ভাইয়ের জীবনে কী পরিবর্তন এসেছে?",

      },
      {
        title: "পাঠ ১৩: দানবীর মুহসিন (অনুশীলনী প্রশ্নোত্তর)",
        qa: [
          {
            q: "১. হাজী মুহাম্মদ মুহসিন মানুষের দুঃখ দেখলে কী করতেন?",
            a: "মানুষের দুঃখ-কষ্ট দেখলে হাজী মুহাম্মদ মুহসিনের মন খুব খারাপ হতো। তিনি অসহায় ও গরিব মানুষকে টাকা ও খাবার দিয়ে সাহায্য করতেন।"
          },

          {
            q: "৩. চোরকে ধরে ফেলার পর মুহসিন কী ব্যবহার করেছিলেন?",

          },

            q: "৪. আমরা হাজী মুহাম্মদ মুহসিনের জীবন থেকে কী শিখতে পারি?",
            a: "আমরা তাঁর জীবন থেকে শিখতে পারি যে গরিব ও অসহায় মানুষকে সাহায্য করতে হয়। কারও বিপদে রাগ না করে দয়া ও ক্ষমা দেখাতে হয়।"

        qa: [
          {
            q: "১. অসুস্থতার কারণে অমল সারাদিন কী করত?",
            a: "অসুস্থতার জন্য অমল বাইরে যেতে পারত না এবং সারাদিন ঘরে থাকত। সে জানালার পাশে বসে বাইরের গাছ, পাখি ও মানুষের চলাচল দেখত।"

            q: "৪. দইওয়ালা অমলকে কেন ভালোবেসেছিল এবং কী দিয়েছিল?",
            a: "অমলের মিষ্টি কথা ও সহজ মনে ভালো লাগায় দইওয়ালা তাকে ভালোবেসেছিল। সে অমলকে এক ভাঁড় ভালো দই খেতে দিয়েছিল।"

        title: "পাঠ ১৫: প্রিয় স্বাধীনতা (অনুশীলনী প্রশ্নোত্তর)",

    const app = document.getElementById("app");

    chapters.forEach((ch, chIdx) => {
      const card = document.createElement("section");
      card.className = "chapter-card";
      card.id = `chapter-${chIdx}`;

      const itemsHtml = ch.qa
        .map(
          (item, qIdx) => `
          <li class="qa-item">
            <div class="question">${item.q}</div>
            <div class="answer-box" id="ans-${chIdx}-${qIdx}"><strong>উত্তর:</strong> ${item.a}</div>
          </li>
        `
        )
        .join("");

      card.innerHTML = `
        <div class="chapter-header">
          <h2 class="chapter-title">${ch.title}</h2>
          <div class="chapter-actions">
            <button class="btn-show" onclick="setChapterAnswers(${chIdx}, true)">Show Answer</button>
            <button class="btn-hide" onclick="setChapterAnswers(${chIdx}, false)">Hide Answer</button>
          </div>
        </div>
        <ul class="qa-list">${itemsHtml}</ul>
      `;

      app.appendChild(card);
    });

    function setChapterAnswers(chIdx, show) {
      const boxes = document.querySelectorAll(`#chapter-${chIdx} .answer-box`);
      boxes.forEach((box) => {
        box.classList.toggle("visible", show);
      });
    }

    function toggleAll(show) {
      document.querySelectorAll(".answer-box").forEach((box) => {
        box.classList.toggle("visible", show);
      });
    }
