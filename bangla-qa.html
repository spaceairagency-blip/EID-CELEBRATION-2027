<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>চতুর্থ শ্রেণি — আমার বাংলা বই: সব পাঠের অনুশীলনী প্রশ্নোত্তর</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #18222f;
      --muted: #5b6878;
      --accent: #0f766e;
      --accent-hover: #0d5e58;
      --secondary: #334155;
      --secondary-hover: #1e293b;
      --ans-bg: #dcfce7;
      --ans-text: #14532d;
      --imp-bg: #fef9c3;
      --imp-text: #713f12;
      --imp-border: #ca8a04;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans Bengali", "Hind Siliguri", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.85;
      font-size: 18px;
    }

    header {
      background: linear-gradient(135deg, #0f766e, #115e59);
      color: #fff;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(15, 118, 110, 0.16);
    }

    header h1 { margin: 0 0 6px; font-size: 1.8rem; }
    header p { margin: 0; opacity: 0.94; font-size: 1rem; }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 960px;
      margin: 24px auto 60px;
      padding: 0 16px;
    }

    .chapter-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 22px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .chapter-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid #eef2f6;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .chapter-title { margin: 0; font-size: 1.28rem; color: var(--accent); }
    .chapter-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    button {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.08s ease;
    }

    button:active { transform: scale(0.98); }
    .btn-show { background: var(--accent); color: #fff; }
    .btn-show:hover { background: var(--accent-hover); }
    .btn-hide { background: #eef2f6; color: var(--secondary); }
    .btn-hide:hover { background: #dbe3ec; }
    .btn-global-show { background: var(--accent); color: #fff; padding: 10px 18px; }
    .btn-global-hide { background: var(--secondary); color: #fff; padding: 10px 18px; }
    .btn-global-hide:hover { background: var(--secondary-hover); }

    .qa-list { list-style: none; margin: 0; padding: 0; }
    .qa-item { padding: 14px 0; border-bottom: 1px dashed #e2e8f0; }
    .qa-item:last-child { border-bottom: none; padding-bottom: 4px; }
    .question { font-weight: 600; margin-bottom: 8px; }

    .badge-imp {
      display: inline-block;
      background: #fef08a;
      color: #713f12;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .answer-box {
      display: none;
      background: var(--ans-bg);
      color: var(--ans-text);
      padding: 12px 14px;
      border-radius: 8px;
      border-left: 4px solid #16a34a;
      font-weight: 500;
    }

    .answer-box.important-ans {
      background: var(--imp-bg);
      color: var(--imp-text);
      border-left: 4px solid var(--imp-border);
      padding: 14px 16px;
    }

    .answer-box.visible { display: block; }

    @media (max-width: 600px) {
      body { font-size: 16.5px; }
      .chapter-card { padding: 18px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>চতুর্থ শ্রেণি — আমার বাংলা বই (সব পাঠের অনুশীলনী প্রশ্নোত্তর)</h1>
    <p>পাঠ ১ থেকে পাঠ ২৩ পর্যন্ত — অনুশীলনীর সব প্রশ্ন ও সহজ ভাষায় উত্তর</p>
  </header>

  <div class="toolbar">
    <button class="btn-global-show" onclick="toggleAll(true)">সব উত্তর দেখুন (Show Answer)</button>
    <button class="btn-global-hide" onclick="toggleAll(false)">সব উত্তর লুকান (Hide Answer)</button>
  </div>

  <main class="container" id="app"></main>

  <script>
    const chapters = [
      {
        title: "পাঠ ১: বাংলাদেশের প্রকৃতি (অনুশীলনী)",
        qa: [
          { q: "১. বাংলাদেশে বছরে কয়টি ঋতু আসে যায় এবং কী কী?", important: false, a: "বাংলাদেশে বছরে ছয়টি ঋতু আসে যায়। সেগুলো হলো— গ্রীষ্ম, বর্ষা, শরৎ, হেমন্ত, শীত ও বসন্ত।" },
          { q: "২. কোন কোন মাস নিয়ে কোন ঋতু হয়?", important: false, a: "বৈশাখ ও জ্যৈষ্ঠ নিয়ে গ্রীষ্ম; আষাঢ় ও শ্রাবণ নিয়ে বর্ষা; ভাদ্র ও আশ্বিন নিয়ে শরৎ; কার্তিক ও অগ্রহায়ণ নিয়ে হেমন্ত; পৌষ ও মাঘ নিয়ে শীত এবং ফাল্গুন ও চৈত্র নিয়ে বসন্ত ঋতু হয়।" },
          { q: "৩. আমার দেখা বর্ষা ও শীত ঋতুর তুলনা করো।", important: true, a: "বর্ষাকালে আকাশ কালো মেঘে ঢেকে যায় এবং ঝমঝম করে বৃষ্টি পড়ে। নদী-নালা ও খাল-বিল পানিতে ভরে যায় এবং কদম ও কেয়া ফুল ফোটে। অন্যদিকে শীতকালে ঠান্ডা বাতাস বয় এবং সকালে চারদিকে ঘন কুয়াশা দেখা যায়। শীতকালে খেজুরের রস, পিঠা-পুলি ও রঙিন শাকসবজি পাওয়া যায়। দুটি ঋতুই আমাদের প্রকৃতিকে আলাদা সৌন্দর্য দেয়।" },
          { q: "৪. কোন ঋতু আমার সবচেয়ে পছন্দ ও কেন?", important: true, a: "বসন্ত ঋতু আমার সবচেয়ে পছন্দ, কারণ এই সময় প্রকৃতি খুব সুন্দর হয়ে ওঠে। গাছে গাছে নতুন সবুজ পাতা গজায় এবং শিমুল, পলাশ ও কৃষ্ণচূড়া ফুল ফোটে। কোকিলের মিষ্টি ডাক শোনা যায় এবং আবহাওয়া খুব আরামদায়ক থাকে। না বেশি গরম, না বেশি শীত—তাই বসন্তকে ঋতুরাজ বলা হয়।" }

      {
        title: "পাঠ ২: পালকির গান (অনুশীলনী)",

          { q: "২. দুপুরে রোদের মধ্যে পালকি বেহারারা কীভাবে চলেন?", important: true, a: "দুপুরের কড়া রোদে চারদিক যখন ঝাঁ ঝাঁ করে, তখন বেহারারা কাঁধে পালকি নিয়ে চলেন। রোদের তাপে তাঁদের শরীর ঘেমে যায়, তবুও তাঁরা 'হুন হুনা হুন' ছন্দে গান গেয়ে পথ চলেন। গানের তালে তালে চললে তাঁদের পথের ক্লান্তি ও কষ্ট অনেকটা কমে যায়।" },
          { q: "৩. গাঁয়ের বধূ পালকিতে চড়ে কোথায় যান?", important: false, a: "গাঁয়ের বধূ পালকিতে চড়ে বাপের বাড়ি বা নতুন শ্বশুরবাড়িতে যান।" },

          { q: "১. কবিতায় শিশুটি কার কাছে ছুটি চেয়েছে এবং কেন?", important: false, a: "শিশুটি তার মায়ের কাছে ছুটি চেয়েছে, কারণ বাইরে সুন্দর প্রকৃতি তাকে ডাকছে এবং আজ তার পড়তে ভালো লাগছে না।" },
          { q: "২. বাইরে প্রকৃতির কোন কোন দৃশ্য শিশুটিকে আকর্ষণ করছে?", important: true, a: "বাইরে রোদ ঝলমল করছে, মেঘের ভেলা ভেসে বেড়াচ্ছে এবং গাছের পাতায় বাতাস দুলছে। পাখিরা গান গাইছে এবং প্রজাপতি ফুলে ফুলে উড়ে বেড়াচ্ছে। প্রকৃতির এই সুন্দর ও আনন্দময় দৃশ্যগুলো শিশুটিকে ঘরের বাইরে টেনে নিয়ে যাচ্ছে।" },

        ]
      },
      {
        title: "পাঠ ৬: বীরশ্রেষ্ঠদের বীরগাথা (অনুশীলনী)",
        qa: [
          { q: "১. বীরশ্রেষ্ঠ কাকে বলে এবং বাংলাদেশে কতজন বীরশ্রেষ্ঠ আছেন?", important: false, a: "মুক্তিযুদ্ধে অসীম সাহস ও বীরত্ব দেখিয়ে যাঁরা দেশের জন্য জীবন দিয়েছেন, তাঁদের সর্বোচ্চ সম্মান হিসেবে 'বীরশ্রেষ্ঠ' উপাধি দেওয়া হয়েছে। বাংলাদেশে ৭ জন বীরশ্রেষ্ঠ আছেন।" },
          { q: "২. বীরশ্রেষ্ঠ মুন্সী আবদুর রউফ কীভাবে যুদ্ধ করে শহীদ হন?", important: true, a: "১৯৭১ সালের এপ্রিল মাসে রাঙামাটির বুড়িঘাটে পাকিস্তানি সেনারা মুক্তিযোদ্ধাদের চারদিক থেকে ঘিরে ফেলে। সহযোদ্ধাদের নিরাপদে সরিয়ে নিতে মুন্সী আবদুর রউফ একাই মেশিনগান চালিয়ে শত্রুদের আটকে রাখেন। তাঁর গুলিতে শত্রুপক্ষের অনেক ক্ষতি হয় এবং শেষ পর্যন্ত শত্রুর গোলার আঘাতে তিনি শহীদ হন।" },
          { q: "৩. বীরশ্রেষ্ঠ মোস্তফা কামাল ও বীরশ্রেষ্ঠ মতিউর রহমানের অবদান কী?", important: true, a: "বীরশ্রেষ্ঠ মোস্তফা কামাল ব্রাহ্মণবাড়িয়ার দরুইন গ্রামে সহযোদ্ধাদের বাঁচাতে একাই লড়াই করে শহীদ হন। আর বীরশ্রেষ্ঠ ফ্লাইট লেফটেন্যান্ট মতিউর রহমান মুক্তিযুদ্ধে যোগ দেওয়ার জন্য পাকিস্তানি বিমান ছিনতাই করে দেশে ফেরার পথে বিমান বিধ্বস্ত হয়ে শহীদ হন। তাঁদের আত্মত্যাগ আমরা চিরদিন শ্রদ্ধার সাথে মনে রাখব।" }
        ]
      },
      {
        title: "পাঠ ৭: মোবাইল ফোন (অনুশীলনী)",
        qa: [
          { q: "১. মোবাইল ফোন কী এবং এটি কীভাবে কাজ করে?", important: false, a: "মোবাইল ফোন হলো তারহীন একটি আধুনিক যোগাযোগ যন্ত্র, যা বেতার তরঙ্গ বা নেটওয়ার্কের মাধ্যমে এক জায়গা থেকে অন্য জায়গায় কথা ও তথ্য পাঠায়।" },
          { q: "২. মোবাইল ফোনের মাধ্যমে আমরা কী কী সুবিধা পাই?", important: true, a: "মোবাইল ফোনের মাধ্যমে আমরা মুহূর্তের মধ্যে পৃথিবীর যেকোনো প্রান্তে থাকা মানুষের সাথে কথা বলতে ও ভিডিও কল করতে পারি। এ ছাড়া খুদে বার্তা পাঠানো, ইন্টারনেট ব্যবহার করা, ছবি তোলা, পড়াশোনার তথ্য খোঁজা এবং জরুরি খবর জানা যায়। এটি আমাদের দৈনন্দিন জীবনকে অনেক সহজ করে দিয়েছে।" },
          { q: "৩. মোবাইল ফোন ব্যবহারে আমাদের কী কী সতর্কতা মেনে চলা উচিত?", important: false, a: "প্রয়োজনের বেশি মোবাইল ফোন ব্যবহার করা উচিত নয়, কারণ এতে চোখ ও পড়াশোনার ক্ষতি হয়। বড়দের অনুমতি নিয়ে ভালো কাজে মোবাইল ব্যবহার করা উচিত।" }
        ]
      },
      {

        qa: [
          { q: "১. 'মা' কথাটি শুনলে মনের ভেতর কেমন অনুভূতি হয়?", important: false, a: "'মা' কথাটি শুনলে মনের ভেতর গভীর ভালোবাসা, শান্তি ও আনন্দের অনুভূতি হয়। মায়ের মুখ দেখলে সব দুঃখ-কষ্ট দূর হয়ে যায়।" },
          { q: "২. মা সন্তানের জন্য কী কী করেন এবং মায়ের প্রতি আমাদের কর্তব্য কী?", important: true, a: "মা জন্মের পর থেকে সন্তানকে পরম স্নেহ ও মমতা দিয়ে লালন-পালন করেন। সন্তান অসুস্থ হলে মা রাত জেগে সেবা করেন এবং সন্তানের মুখে হাসি দেখলে নিজে খুশি হন। তাই মায়ের প্রতি আমাদের কর্তব্য হলো মাকে শ্রদ্ধা করা, তাঁর কথা মেনে চলা, ভালোভাবে পড়াশোনা করা এবং সব সময় মায়ের সেবা করা।" },
          { q: "৩. 'মা' কবিতাটি কার লেখা?", important: false, a: "'মা' কবিতাটি কবি কাজী নজরুল ইসলামের লেখা।" }
        ]

          { q: "২. কখন কখন আমাদের সাবান দিয়ে ভালোভাবে হাত ধোয়া উচিত?", important: true, a: "খাওয়ার আগে ও পরে, শৌচাগার ব্যবহারের পর, বাইরে খেলাধুলা করে ঘরে ফিরে এবং যেকোনো ময়লা জিনিস ধরার পর সাবান ও পরিষ্কার পানি দিয়ে ভালোভাবে হাত ধোয়া উচিত। নিয়মিত হাত ধুলে হাতের রোগজীবাণু দূর হয় এবং আমরা পেটের অসুখ ও নানা রোগ থেকে সুস্থ থাকতে পারি।" },
          { q: "৩. পরিষ্কার-পরিচ্ছন্ন থাকার সুফল কী?", important: false, a: "পরিষ্কার-পরিচ্ছন্ন থাকলে শরীর সুস্থ ও মন প্রফুল্ল থাকে এবং রোগব্যাধি দূরে থাকে।" }

          { q: "২. বাংলাদেশের কয়েকটি পরিচিত পাখির পরিচয় দাও।", important: true, a: "বাংলাদেশে নানা ধরনের সুন্দর পাখি দেখা যায়। যেমন— দোয়েল আমাদের জাতীয় পাখি, যা মিষ্টি সুরে গান গায়। টুনটুনি খুব ছোট ও চঞ্চল পাখি, যে পাতা সেলাই করে বাসা বানায়। বুলবুলি, শালিক, ময়না, টিয়া ও কোকিল আমাদের পরিচিত পাখি। বসন্তকালে কোকিলের কুহু ডাক সবার মন ভরিয়ে দেয়।" },

          { q: "২. আমরা কীভাবে মুক্ত ও স্বাধীন দেশ পেয়েছি তা ছড়ার আলোকে লেখো।", important: true, a: "অনেক সংগ্রাম, সাহস ও ত্যাগের বিনিময়ে আমরা শত্রুদের পরাজিত করে আমাদের প্রিয় স্বাধীনতা অর্জন করেছি। এখন আমাদের আকাশ মুক্ত, বাতাস মুক্ত এবং আমরা স্বাধীনভাবে নিজেদের ভাষায় কথা বলতে পারি। এই স্বাধীনতা রক্ষা করা এবং দেশকে ভালোবাসা আমাদের সবার দায়িত্ব।" },
          { q: "৩. 'মুক্তির ছড়া' কবিতাটি কার লেখা?", important: false, a: "'মুক্তির ছড়া' কবিতাটি সানাউল হকের লেখা।" }

          { q: "২. ছোট ভাই কেন কাজলা দিদিকে খুঁজছে এবং দিদির চলে যাওয়ার পর তার মনের অবস্থা কেমন হয়েছে?", important: true, a: "কাজলা দিদি আর বেঁচে নেই, তাই ছোট ভাই তাকে খুব মনে করছে। রাতে একা জেগে থেকে সে তার প্রিয় দিদিকে কাছে পেতে খুঁজছে। আগে দিদি তাকে নিয়ে খেলত, আদর করত এবং ভালোবাসত। দিদি চলে যাওয়ার পর ছোট ভাই খুব একা হয়ে গেছে এবং তার মন সব সময় খারাপ থাকে। ফুলের গন্ধেও তার ঘুম আসে না, সে শুধু দিদির কথা ভাবে।" },
          { q: "৩. ছোট ভাইয়ের রাতে ঘুম না আসার কারণ কী?", important: false, a: "কাজলা দিদির কথা মনে পড়ায় এবং ফুলের গন্ধে ছোট ভাইয়ের রাতে ঘুম আসে না। সে একা জেগে থাকে এবং দিদির কথা ভাবে।" }

      {

          { q: "২. চোরকে ধরার পর মুহসিন কী করেছিলেন এবং আমরা তাঁর জীবন থেকে কী শিখতে পারি?", important: true, a: "চোরটি ঘরে চুরি করতে ঢুকলে মুহসিন তাকে বকা না দিয়ে বা শাস্তি না দিয়ে ক্ষমা করে দেন। চোরের পরিবারে অভাব ছিল বলে সে কষ্টে ছিল, তাই মুহসিন তাকে কিছু টাকা দেন যাতে সে ভালোভাবে চলতে পারে। আমরা হাজী মুহাম্মদ মুহসিনের জীবন থেকে শিখতে পারি যে গরিব ও অসহায় মানুষকে সাহায্য করতে হয়। কারও ভুল বা বিপদে রাগ না করে দয়া, ভালোবাসা ও ক্ষমা দেখাতে হয়।" },
          { q: "৩. চোরটি কেন মুহসিনের ঘরে চুরি করতে ঢুকেছিল?", important: false, a: "চোরটির পরিবারে খুব অভাব ছিল এবং খেতে না পেয়ে সে কষ্টে ছিল। সেই অভাবের কারণেই সে চুরি করতে ঢুকেছিল।" }

          { q: "২. বক্তার স্বভাব ও মনের অবস্থা কেমন তা ছড়ায় কীভাবে বলা হয়েছে এবং এর কবি কে?", important: true, a: "'ভয় পেয়ো না' ছড়াটি লিখেছেন সুকুমার রায়। ছড়ায় বলা হয়েছে যে বক্তার মন খুব নরম এবং তার মনে কোনো রাগ নেই। তিনি মারামারি বা রাগারাগির বদলে হাসি ও বন্ধুত্বের কথা বলেছেন এবং কাউকে কামড়ে দেওয়ার বা কষ্ট দেওয়ার ভাবনা তাঁর নেই। এই ছড়া থেকে বোঝা যায় যে নরম মনের মানুষ কখনো অন্যের ক্ষতি করতে চায় না।" },
          { q: "৩. 'ভয় পেয়ো না' ছড়াটি পড়লে আমাদের কেমন লাগে?", important: false, a: "ছড়াটি পড়লে খুব হালকা ও মজার অনুভূতি হয়। এর সহজ কথা ও ছন্দ শিশুদের খুব সহজেই আনন্দ দেয়।" }
        ]
      },
      {
        title: "পাঠ ২২: খলিফা উমর (রা.) (অনুশীলনী)",
        qa: [
          { q: "১. হযরত উমর (রা.) রাতে কেন মানুষের খোঁজখবর নিতেন?", important: false, a: "কেউ না খেয়ে আছে কি না বা কারও কোনো কষ্ট আছে কি না তা জানার জন্য তিনি রাতে বের হতেন। একজন শাসক হিসেবে মানুষের সেবা করাই ছিল তাঁর লক্ষ্য।" },
          { q: "২. ক্ষুধার্ত শিশুদের চুপ করাতে মা কী করছিলেন এবং ঘটনাটি শুনে খলিফা উমর (রা.) কী করেছিলেন?", important: true, a: "ঘরে খাবার না থাকায় ক্ষুধার্ত শিশুদের ভোলাতে মা হাঁড়িতে পাথর ও পানি চাপিয়ে রেখেছিলেন, যেন মনে হয় খাবার রান্না হচ্ছে। ঘটনাটি দেখে ও শুনে খলিফা উমর (রা.) খুব কষ্ট পেলেন এবং দেরি না করে নিজে পিঠে করে আটার বস্তা বয়ে এনে ওই পরিবারের হাতে তুলে দিলেন। তাঁর সরলতা, ন্যায়বিচার ও মানুষের কষ্টে এগিয়ে আসার স্বভাব আমাদের খুব ভালো লাগে।" },
          { q: "৩. খলিফা উমর (রা.)-এর চরিত্রের কোন দিকটি আমাদের ভালো লাগে?", important: false, a: "তাঁর সরলতা, ন্যায়বিচার ও মানুষের কষ্টে এগিয়ে আসার স্বভাব আমাদের খুব ভালো লাগে। তিনি নিজের দায়িত্ব খুব আন্তরিকভাবে পালন করতেন।" }
        ]
      },
      {
        title: "পাঠ ২৩: পাঠাগারের সদস্য হই (অনুশীলনী)",
        qa: [
          { q: "১. পাঠাগার কাকে বলে এবং সেখানে কী কী থাকে?", important: false, a: "যেখানে অনেক বই সাজিয়ে রাখা হয় এবং মানুষ গিয়ে বই পড়ে তাকে পাঠাগার বলে। সেখানে গল্প, কবিতা, বিজ্ঞান ও নানা বিষয়ের বই থাকে।" },
          { q: "২. বই পড়লে আমাদের কী কী উপকার হয় এবং কেন আমাদের পাঠাগারের সদস্য হওয়া উচিত?", important: true, a: "বই পড়লে আমাদের জ্ঞান বাড়ে, চিন্তা করার ক্ষমতা উন্নত হয় এবং নতুন নতুন কথা জেনে আমরা ভালো মানুষ হতে পারি। নিয়মিত বই পড়ার অভ্যাস তৈরি করার জন্য আমাদের পাঠাগারের সদস্য হওয়া উচিত। পাঠাগারে গেলে চুপচাপ ও শান্তভাবে বই পড়তে হয় এবং বই যত্ন করে ব্যবহার করতে হয়। এতে সহজেই ভালো বই পড়ে অবসর সময় সুন্দরভাবে কাটানো যায়।" },
          { q: "৩. পাঠাগারে গেলে আমাদের কোন নিয়মগুলো মেনে চলা উচিত?", important: false, a: "পাঠাগারে গেলে চুপচাপ ও শান্তভাবে থাকতে হয় যাতে অন্যের পড়ায় ব্যাঘাত না ঘটে। বই যত্ন করে ব্যবহার করতে হয় ও যথাসময়ে ফেরত দিতে হয়।" }
        ]
      }
    ];

    const app = document.getElementById("app");

    chapters.forEach((ch, chIdx) => {
      const card = document.createElement("section");
      card.className = "chapter-card";
      card.id = `chapter-${chIdx}`;

      const itemsHtml = ch.qa
        .map(
          (item, qIdx) => `
          <li class="qa-item">
            <div class="question">
              ${item.q}
              ${item.important ? '<span class="badge-imp">গুরুত্বপূর্ণ বড় উত্তর</span>' : ""}
            </div>
            <div class="answer-box ${item.important ? "important-ans" : ""}" id="ans-${chIdx}-${qIdx}">
              <strong>উত্তর:</strong> ${item.a}
            </div>
          </li>
        `
        )
        .join("");

      card.innerHTML = `
        <div class="chapter-header">
          <h2 class="chapter-title">${ch.title}</h2>
          <div class="chapter-actions">
            <button class="btn-show" onclick="setChapterAnswers(${chIdx}, true)">Show Answer</button>
            <button class="btn-hide" onclick="setChapterAnswers(${chIdx}, false)">Hide Answer</button>
          </div>
        </div>
        <ul class="qa-list">${itemsHtml}</ul>
      `;

      app.appendChild(card);
    });

    function setChapterAnswers(chIdx, show) {
      const boxes = document.querySelectorAll(`#chapter-${chIdx} .answer-box`);
      boxes.forEach((box) => box.classList.toggle("visible", show));
    }

    function toggleAll(show) {
      document.querySelectorAll(".answer-box").forEach((box) => box.classList.toggle("visible", show));
    }
  </script>
</body>
</html>
